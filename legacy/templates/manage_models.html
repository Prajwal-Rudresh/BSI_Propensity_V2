<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            padding: 20px;
            background-color: #f8f9fa;
        }
        .container {
            background-color: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 1200px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            font-weight: 600;
        }
        .model-card {
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            background-color: #ffffff;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .model-card:hover {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        .model-filename {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
        .model-info {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
        .btn-group {
            gap: 8px;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 0.875rem;
        }
        .btn-rename {
            background-color: #17a2b8;
            border-color: #17a2b8;
            color: white;
        }
        .btn-rename:hover {
            background-color: #138496;
            border-color: #117a8b;
            color: white;
        }
        .btn-delete {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
        }
        .btn-delete:hover {
            background-color: #c82333;
            border-color: #bd2130;
            color: white;
        }
        .no-models {
            text-align: center;
            color: #6c757d;
            font-style: italic;
            padding: 40px;
            background-color: #f8f9fa;
            border-radius: 8px;
            border: 2px dashed #dee2e6;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .edit-form {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #17a2b8;
            margin-top: 15px;
        }
        .file-size {
            font-weight: 500;
            color: #495057;
        }
        .file-date {
            font-size: 0.85rem;
            color: #868e96;
        }
        .refresh-btn {
            background-color: #28a745;
            border-color: #28a745;
        }
        .refresh-btn:hover {
            background-color: #218838;
            border-color: #1e7e34;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <!-- Navigation Links -->
        <div class="nav-links">
            <a href="/" class="btn btn-outline-primary">
                <i class="bi bi-house"></i> Home
            </a>
            <a href="/upload-files" class="btn btn-outline-secondary">
                <i class="bi bi-cloud-upload"></i> Upload Files
            </a>
        </div>

        <!-- Page Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i class="bi bi-folder"></i> File Management</h1>
            <button id="refreshBtn" class="btn refresh-btn">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>

        <!-- Filter Section -->
        <div class="mb-3">
            <label for="categoryFilter" class="form-label fw-bold">Filter by Category:</label>
            <select class="form-select" id="categoryFilter" style="max-width: 300px;">
                <option value="all">All Files</option>
                <option value="models">Models (.pkl)</option>
                <option value="final_predictions">Final Predictions</option>
                <option value="prediction_data">Prediction Data</option>
                <option value="training_data">Training Data</option>
            </select>
        </div>

        <!-- Alert for messages -->
        <div id="alertContainer"></div>

        <!-- Models Container -->
        <div id="modelsContainer">
            <div class="loading">
                <i class="bi bi-hourglass-split"></i> Loading models...
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div class="modal fade" id="renameModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Rename File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="renameForm">
                        <div class="mb-3">
                            <label for="currentFilename" class="form-label">Current Filename</label>
                            <input type="text" class="form-control" id="currentFilename" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="newFilename" class="form-label">New Filename</label>
                            <input type="text" class="form-control" id="newFilename" placeholder="Enter new filename" required>
                            <div class="form-text">File extension will be preserved automatically.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="confirmRename">Rename File</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title text-danger">Delete File</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-warning">
                        <i class="bi bi-exclamation-triangle"></i>
                        <strong>Warning!</strong> This action cannot be undone.
                    </div>
                    <p>Are you sure you want to delete the following file?</p>
                    <div class="alert alert-light">
                        <code id="deleteFilename"></code>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmDelete">
                        <i class="bi bi-trash"></i> Delete File
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let allFiles = [];
        let currentRenameFile = null;
        let currentDeleteFile = null;

        let renameModal, deleteModal;

        document.addEventListener('DOMContentLoaded', function() {
            loadModels();

            // Refresh button
            document.getElementById('refreshBtn').addEventListener('click', loadModels);

            // Category filter
            document.getElementById('categoryFilter').addEventListener('change', filterAndRender);

            // Initialize modals
            renameModal = new bootstrap.Modal(document.getElementById('renameModal'));
            deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

            document.getElementById('confirmRename').addEventListener('click', function() {
                const newFilename = document.getElementById('newFilename').value.trim();
                if (newFilename && currentRenameFile) {
                    renameModel(currentRenameFile, newFilename, renameModal);
                }
            });

            document.getElementById('confirmDelete').addEventListener('click', function() {
                if (currentDeleteFile) {
                    deleteModel(currentDeleteFile);
                    deleteModal.hide();
                }
            });
        });

        // Helper function to show delete modal - accessible from inline onclick
        window.showDeleteModal = function(filename, directory) {
            // Create file object from parameters
            currentDeleteFile = {
                filename: filename,
                directory: directory
            };
            // Set the filename text
            document.getElementById('deleteFilename').textContent = filename;
            deleteModal.show();
        }

        // Helper function to show rename modal - accessible from inline onclick
        window.showRenameModal = function(filename, directory) {
            // Create file object from parameters
            currentRenameFile = {
                filename: filename,
                directory: directory
            };
            // Set the current filename
            document.getElementById('currentFilename').value = filename;
            document.getElementById('newFilename').value = '';
            renameModal.show();
        }

        function loadModels() {
            showAlert('info', 'Loading files...', false);

            fetch('/api/files')
                .then(response => response.json())
                .then(data => {
                    hideAlert();
                    if (data.error) {
                        showAlert('danger', `Error loading files: ${data.error}`);
                        return;
                    }

                    allFiles = data.files || [];
                    filterAndRender();
                })
                .catch(error => {
                    hideAlert();
                    showAlert('danger', `Failed to load files: ${error.message}`);
                });
        }

        function filterAndRender() {
            const categoryFilter = document.getElementById('categoryFilter').value;
            let filteredFiles = allFiles;

            if (categoryFilter !== 'all') {
                filteredFiles = allFiles.filter(file => file.category === categoryFilter);
            }

            renderModels(filteredFiles);
        }

        function getCategoryBadge(category) {
            const badges = {
                'models': '<span class="badge bg-primary">Model</span>',
                'final_predictions': '<span class="badge bg-success">Final Predictions</span>',
                'prediction_data': '<span class="badge bg-warning text-dark">Prediction Data</span>',
                'training_data': '<span class="badge bg-info text-dark">Training Data</span>',
                'other': '<span class="badge bg-secondary">Other</span>'
            };
            return badges[category] || badges['other'];
        }

        function renderModels(files) {
            const container = document.getElementById('modelsContainer');

            if (files.length === 0) {
                container.innerHTML = `
                    <div class="no-models">
                        <i class="bi bi-folder-x" style="font-size: 3rem; margin-bottom: 15px; display: block;"></i>
                        <h4>No Files Found</h4>
                        <p>No files are currently available in the selected category.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            files.forEach(model => {
                const fileSize = formatFileSize(model.size);
                const modifiedDate = new Date(model.modified * 1000).toLocaleString();
                const createdDate = new Date(model.created * 1000).toLocaleString();
                const categoryBadge = getCategoryBadge(model.category);

                // Escape quotes in filename and directory for onclick handlers
                const escapedFilename = model.filename.replace(/'/g, "\\'");
                const escapedDirectory = model.directory.replace(/'/g, "\\'");

                html += `
                    <div class="model-card">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <div class="model-filename">
                                    <i class="bi bi-file-earmark-binary"></i> ${model.filename}
                                    ${categoryBadge}
                                </div>
                                <div class="model-info">
                                    <span class="file-size"><i class="bi bi-hdd"></i> ${fileSize}</span> • 
                                    <span class="file-date"><i class="bi bi-clock"></i> Modified: ${modifiedDate}</span>
                                </div>
                                <div class="model-info">
                                    <span class="file-date"><i class="bi bi-calendar"></i> Created: ${createdDate}</span>
                                </div>
                            </div>
                            <div class="col-md-4 text-end">
                                <div class="btn-group">
                                    <button class="btn btn-rename btn-sm" onclick="showRenameModal('${escapedFilename}', '${escapedDirectory}')">
                                        <i class="bi bi-pencil"></i> Rename
                                    </button>
                                    <button class="btn btn-delete btn-sm" onclick="showDeleteModal('${escapedFilename}', '${escapedDirectory}')">
                                        <i class="bi bi-trash"></i> Delete
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }


        function renameModel(fileObj, newFilename, modalInstance) {
            showAlert('info', `Renaming "${fileObj.filename}" to "${newFilename}"...`, false);

            fetch('/api/files/rename', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    old_filename: fileObj.filename,
                    new_filename: newFilename,
                    directory: fileObj.directory
                })
            })
            .then(response => {
                // Close modal on successful HTTP response (200-299)
                if (response.ok) {
                    modalInstance.hide();
                }
                return response.json();
            })
            .then(data => {
                hideAlert();
                if (data.error) {
                    showAlert('danger', `Error renaming file: ${data.error}`);
                    return;
                }

                showAlert('success', data.message || 'File renamed successfully');
                loadModels(); // Refresh the list
            })
            .catch(error => {
                hideAlert();
                showAlert('danger', `Failed to rename file: ${error.message}`);
                // Keep modal open on error so user can try again
            });
        }

        function deleteModel(fileObj) {
            showAlert('warning', `Deleting "${fileObj.filename}"...`, false);

            fetch('/api/files/delete', {
                method: 'DELETE',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    filename: fileObj.filename,
                    directory: fileObj.directory
                })
            })
            .then(response => response.json())
            .then(data => {
                hideAlert();
                if (data.error) {
                    showAlert('danger', `Error deleting file: ${data.error}`);
                    return;
                }

                showAlert('success', data.message);
                loadModels(); // Refresh the list
            })
            .catch(error => {
                hideAlert();
                showAlert('danger', `Failed to delete file: ${error.message}`);
            });
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function showAlert(type, message, autoHide = true) {
            const container = document.getElementById('alertContainer');
            const alertId = 'alert-' + Date.now();

            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" id="${alertId}" role="alert">
                    <i class="bi bi-${getAlertIcon(type)}"></i> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;

            if (autoHide && type === 'success') {
                setTimeout(() => {
                    const alertElement = document.getElementById(alertId);
                    if (alertElement) {
                        const alert = bootstrap.Alert.getOrCreateInstance(alertElement);
                        alert.close();
                    }
                }, 3000);
            }
        }

        function hideAlert() {
            document.getElementById('alertContainer').innerHTML = '';
        }

        function getAlertIcon(type) {
            const icons = {
                'success': 'check-circle',
                'danger': 'exclamation-circle',
                'warning': 'exclamation-triangle',
                'info': 'info-circle'
            };
            return icons[type] || 'info-circle';
        }
    </script>
</body>
</html>
